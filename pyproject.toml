[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ris-kpi"
version = "1.0.0"
description = "RIS KPI tables (ris_view_data, ris_trends_data) for the NHAI DHMS programme"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "pyarrow>=15.0",
    "openpyxl",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ris-kpi = "ris_kpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
